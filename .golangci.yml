version: "2"
linters:
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - errcheck
  settings:
    errcheck:
      check-blank: true
  exclusions:
    rules:
      # Tests intentionally ignore writes/closes; assertions are the checks.
      - path: _test\.go
        linters: [errcheck]
formatters:
  enable:
    - gofmt
    - goimports
run:
  timeout: 5m
issues:
  max-issues-per-linter: 50
