version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
    groups:
      go-dependencies:
        patterns: ["*"]
    ignore:
      # The dagnats pin lives in four artifacts (go.mod, Dockerfile.dagnats,
      # scripts/setup.sh, docs/ops-repo.md) and scripts/check-dagnats-pin.sh
      # fails on drift, so a bot bump can never be merged green. Bump it in one
      # deliberate change: `go get ...@vX.Y.Z`, then align the three copies and
      # run `make validate`.
      - dependency-name: "github.com/danmestas/dagnats"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Dependabot's docker fetcher matches any filename containing "Dockerfile"
  # (dependabot-core/docker file_fetcher.rb), so this one entry covers both
  # Dockerfile.dagnats and Dockerfile.worker at the repo root.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope
