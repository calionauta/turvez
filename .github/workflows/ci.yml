name: ci

on:
  push:
    branches: [main]
  pull_request:
    # Release PRs only touch these; the tag is gated by the main CI run.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-msg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="FETCH_HEAD..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            RANGE="HEAD~1..HEAD"
          else
            RANGE="HEAD"
          fi
          ./scripts/commit-msg-lint.sh --range "$RANGE"

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Guard pre-1.0 policy
        run: ./scripts/guard-version.sh
      - name: Unit and recipe tests
        run: go test ./... -timeout 300s
      - name: Converter output must be valid YAML
        # The converter once emitted flows that every `wmill lint` rejected:
        # a missing `input_transforms`, comments inside the value mapping, and an
        # unquoted summary. A demo that only checks "files were created" cannot
        # see any of that, so the shape is pinned here.
        run: |
          python3 -m pip install --quiet pyyaml ruff
          python3 scripts/test-convert-to-windmill.py
          python3 scripts/test-lint-scripts.py
      - name: Install the pinned engine CLIs
        # dagnats for recipes, wmill for Windmill flows. Each gate is skipped
        # when the checkout has no source for that engine (scripts/validate.sh),
        # so a Windmill-only ops repo does not need dagnats and vice versa.
        run: |
          go install github.com/danmestas/dagnats/cmd/dagnats@$(go list -m -f '{{.Version}}' github.com/danmestas/dagnats)
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Install the Windmill CLI
        # Same binary that scaffolds a Windmill client, so its own scaffold must
        # lint with it. The template ships Windmill flows (clients/_template is
        # excluded from the recipe contract but not from the lint gate's reach),
        # and test-engines.sh shells out to it, so install unconditionally.
        run: npm install -g windmill-cli
      - name: Validate every engine in this checkout
        run: make validate
      - name: Every declared engine scaffolds and validates
        # dagu was declared in engines.json, new-client.sh and the contract test
        # while validate.sh did not know it, so a dagu client could never pass.
        # windmill — the default — scaffolded an EMPTY automation/windmill/ that
        # linted "ok" while checking nothing. This test refuses both states.
        #
        # It runs AFTER the engine CLIs are installed: validate.sh legitimately
        # fails when a recipe's engine CLI is missing, and testing before the
        # install would report that as a scaffold bug.
        run: ./scripts/test-engines.sh
