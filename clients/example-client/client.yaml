# Worked example of clients/_template/client.yaml. Kept on dagnats on purpose:
# it is the engine most integration clients use, and the contract test needs a
# dagnats example to gate.
client: example-client
engine: dagnats       # typed integration example, by design in this fixture
runtime: shared
target:
  nats_url: nats://127.0.0.1:4222
  api_url: http://127.0.0.1:8080
data_class: normal
owner: operator@example.com

# Per-layer hosting. Windmill and Nango are answered separately, because a
# client can run its engine on Cloud and its broker on its own host (or the
# reverse). example-client keeps the broker on Cloud for the remote test.
deployment:
  nango: cloud

# Access plane (docs/access-plane.md). Profile C: shared broker on the
# consultancy host, allowed only because data_class is normal — a pilot shape.
# A sensitive client must be `plane: client`.
access:
  enabled: true
  plane: shared
  surface: mcp
  identity: org
  policy: catalog/policy.yaml
  vendor_account: consultancy

