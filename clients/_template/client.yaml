client: TODO-CLIENT
# Windmill is the default (`engines.json`): a new client starts on the mature,
# centralised system. Switch to dagnats only when the criteria say so —
# docs/client-spine.md#choosing-the-engine.
# windmill = default: UI/forms, step-level replay, non-trivial code steps.
# dagnats  = exception: typed contracts, native approvals, one binary, go test gate.
# dagu     = level 2 only: script-shaped recurrent jobs (docs/script-execution.md).
engine: windmill      # windmill | dagnats | dagu
# runtime/target are read by `./scripts/verify-isolation.sh` and the contract
# test: `shared` runs on the main stack, `dedicated` needs target.host.
runtime: shared       # shared | dedicated
target:
  # windmill (shared or dedicated) — fill these when engine: windmill
  base_url: https://app.windmill.dev
  workspace: TODO-CLIENT
  # dagnats (shared or dedicated)
  # nats_url: nats://127.0.0.1:4222
  # api_url: http://127.0.0.1:8080
  # dedicated server
  # host: TODO-CLIENT.internal
data_class: normal    # normal | sensitive
owner: TODO-OWNER

# Access plane (docs/access-plane.md): the client's own agents calling
# authenticated tools through a broker. Off by default — turning it on is a
# decision, recorded here, and it is the only block that decides who holds the
# credential.
access:
  enabled: false          # true | false
  # plane: client           # client | cloud | shared — required when enabled.
  #                         #   client = broker on the client's infra, under
  #                         #            their account (default; the only plane
  #                         #            allowed for data_class: sensitive)
  #                         #   cloud  = vendor Cloud, under the client's own
  #                         #            account AND card — if the account is
  #                         #            ours this is `shared`, not `cloud`
  #                         #   shared = one broker on our host, pilots with
  #                         #            data_class: normal only
  # surface: mcp            # mcp | none
  # identity: org           # REQUIRED when enabled: org | per-user
  #                         # → connection id <client> | <client>:<user>;
  #                         # org is the recommended default for reliability
  # policy: catalog/policy.yaml
  # vendor_account: client  # client | consultancy — required when plane: cloud
